<h2 class="text-xl font-semibold mb-4 mt-0 text-900">
  {{ taskId ? 'Edit Task' : 'Create Task' }}
</h2>

<form #taskForm="ngForm" (ngSubmit)="taskForm.form.valid && onSubmit()">

  <div class="formgrid grid">

    <div class="field col-12 md:col-6">
      <label class="block mb-2 font-medium text-900">Title</label>
      <input
        type="text"
        pInputText
        name="title"
        [(ngModel)]="task.title"
        required
        #title="ngModel"
        class="w-full"
        [ngClass]="{'ng-invalid ng-dirty': taskForm.submitted && title.invalid}" />
    </div>

    <div class="field col-12 md:col-6">
      <label class="block mb-2 font-medium text-900">Assign To</label>
      <input
        type="text"
        pInputText
        name="assignTo"
        [(ngModel)]="task.assignTo"
        required
        #assignTo="ngModel"
        class="w-full"
        [ngClass]="{'ng-invalid ng-dirty': taskForm.submitted && assignTo.invalid}" />
    </div>

    <div class="field col-12">
      <label class="block mb-2 font-medium text-900">Description</label>
      <textarea
        rows="5"
        pInputTextarea
        name="description"
        [(ngModel)]="task.description"
        class="w-full">
      </textarea>
    </div>

    <div class="field col-12 md:col-4">
      <label class="block mb-2 font-medium text-900">Priority</label>
      <select
        name="priority"
        [(ngModel)]="task.priority"
        class="w-full p-2 border-1 surface-border border-round bg-baseline text-900 raw-select">
        <option value="">Select Priority</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
        <option value="Urgent">Urgent</option>
      </select>
    </div>

    <div class="field col-12 md:col-4">
      <label class="block mb-2 font-medium text-900">Status</label>
      <select
        name="status"
        [(ngModel)]="task.status"
        class="w-full p-2 border-1 surface-border border-round bg-baseline text-900 raw-select">
        <option value="">Select Status</option>
        <option value="To Do">To Do</option>
        <option value="Inprogress">In Progress</option>
        <option value="Done">Done</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>

    <div class="field col-12 md:col-4">
      <label class="block mb-2 font-medium text-900">Due Date</label>
      <p-datepicker
        name="dueDate"
        [(ngModel)]="task.dueDate"
        [showIcon]="true"
        iconDisplay="input"
        class="w-full">
      </p-datepicker>
    </div>

  </div>

  <div class="flex justify-content-end gap-2 mt-4 border-top-1 surface-border pt-3">
    <p-button
      label="Cancel"
      severity="secondary"
      [outlined]="true"
      type="button"
      (onClick)="onClose()">
    </p-button>

    <p-button
      [label]="taskId ? 'Update Task' : 'Create Task'"
      severity="contrast"
      type="submit">
    </p-button>
  </div>

</form>
